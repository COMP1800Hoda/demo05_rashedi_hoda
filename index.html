<!DOCTYPE html>
<html lang="en">

<head>
    <title>My BCIT Project</title>
    <meta name="comp1800 template" content="My 1800 App">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Other libraries go here -->

</head>

<body>

    <!------------------------------>
    <!-- Your HTML Layout go here -->
    <!------------------------------>
    <!-- Stuff for body goes here -->

    <!-- Top Navbar-->
    <nav class="navbar navbar-expand-sm bg-success-subtle">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="./images/hikelogo.png" height="36">
                Hoda App
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            My account
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">My hike</a></li>
                            <li><a class="dropdown-item" href="#">Setting</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <!--End of Top Navbar-->

    <!-- Hero Section starts-->
    <div class="px-3 py-5 my-2 mx-2 text-center bg-dark-subtle"> 
        <img class="d-block mx-auto mb-4" src="./images/hikelogo.png" alt=""
            width="72" height="57">
        <h1 class="display-5 fw-bold text-body-emphasis">Let's Hike Together!</h1>
        <div class="col-lg-6 mx-auto">
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center"> <button type="button"
                    class="btn btn-success btn-lg px-4 gap-3">Explore Hikes</button> <button type="button"
                    class="btn btn-outline-success btn-lg px-4">Read More</button> </div>
        </div>
    </div>
    <!-- Hero section Ends-->

    <!-- Start of the card group-->
    <h1 class="mx-5 mb-4">Popular Hikes</h1>
    <div class="card-group mx-5">
        <div class="card">
            <img src="./images/firsthike.png" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Mountain Hike</h5>
                <p class="card-text">First Option</p>
                <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
            </div>
        </div>
        <div class="card">
            <img src="./images/secondHike.png" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Beautiful Hike</h5>
                <p class="card-text">Second Opiton</p>
                <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
            </div>
        </div>
        <div class="card">
            <img src="./images/thirdHike.png" class="card-img-top" alt="...">
            <div class="card-body">
                <h5 class="card-title">Photo Hike</h5>
                <p class="card-text">Third Option</p>
                <p class="card-text"><small class="text-body-secondary">Last updated 3 mins ago</small></p>
            </div>
        </div>
    </div>
    <!-- End of the card group-->



    <!---------------------------------------------->
    <!-- Your own JavaScript functions go here    -->
    <!---------------------------------------------->

    <!-- Link to scripts of your own -->
    <script type="module" src="./src/main.js"></script>

</body>

</html>
